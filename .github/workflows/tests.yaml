
name: Chat Application CI - Automated Testing

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v --junitxml=pytest-results.xml

      - name: Generate testing summary
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import os

          path = "pytest-results.xml"
          summary = os.environ["GITHUB_STEP_SUMMARY"]

          with open(summary, "a") as f:
              f.write("# Automated Testing Summary\n\n")

              if not os.path.exists(path):
                  f.write("Test results were not generated.\n")
              else:
                  root = ET.parse(path).getroot()
                  cases = root.findall(".//testcase")

                  total = len(cases)
                  failed = sum(
                      1 for c in cases
                      if c.find("failure") is not None
                  )
                  errors = sum(
                      1 for c in cases
                      if c.find("error") is not None
                  )
                  skipped = sum(
                      1 for c in cases
                      if c.find("skipped") is not None
                  )
                  passed = total - failed - errors - skipped

                  f.write("| Metric | Count |\n")
                  f.write("|---|---:|\n")
                  f.write(f"| Total tests | {total} |\n")
                  f.write(f"| Passed | {passed} |\n")
                  f.write(f"| Failed | {failed} |\n")
                  f.write(f"| Errors | {errors} |\n")
                  f.write(f"| Skipped | {skipped} |\n")

                  status = "PASSED" if failed + errors == 0 else "FAILED"
                  f.write(f"\n**Overall result: {status}**\n")
          PY
